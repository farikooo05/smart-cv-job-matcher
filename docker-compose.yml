services:
  db:
    image: pgvector/pgvector:pg16
    container_name: smart-cv-job-matcher-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_matcher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

services:
  ai-service:
    build: ./backend/ai-service
    container_name: smart-cv-job-matcher-ai
    restart: unless-stopped
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      GEMINI_TEMPERATURE: ${GEMINI_TEMPERATURE:-0}
      GEMINI_TOP_P: ${GEMINI_TOP_P:-}
      GEMINI_TOP_K: ${GEMINI_TOP_K:-}
      GEMINI_REQUESTS_PER_MINUTE: ${GEMINI_REQUESTS_PER_MINUTE:-10}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-10}
      RETRIEVAL_DUPLICATE_SIMILARITY: ${RETRIEVAL_DUPLICATE_SIMILARITY:-0.97}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:-}
      DATABASE_URL: postgresql://postgres:local_dev_password@db:5432/cv_matcher
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      db:
        condition: service_healthy
  db:
    image: pgvector/pgvector:pg16
    container_name: smart-cv-job-matcher-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cv_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cv_matcher"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
